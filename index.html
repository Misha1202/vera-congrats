<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おめでとう — Вера</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Noto Serif JP', serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 45%, #0f3460 100%);
  }

  /* Падающие лепестки сакуры */
  .petal {
    position: fixed;
    top: -40px;
    width: 18px;
    height: 14px;
    background: linear-gradient(135deg, #ffd1dc, #ffb3c6);
    border-radius: 70% 0 70% 0;
    opacity: 0.85;
    animation: fall linear infinite;
    z-index: 1;
  }
  @keyframes fall {
    0%   { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }

  /* Луна на заднем фоне */
  .moon {
    position: absolute;
    top: 60px;
    right: 100px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fffbe6, #ffe8a3);
    box-shadow: 0 0 60px 20px rgba(255, 240, 180, 0.4);
    opacity: 0.85;
    animation: glow 4s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes glow { from { box-shadow: 0 0 50px 15px rgba(255,240,180,.35); } to { box-shadow: 0 0 90px 35px rgba(255,240,180,.55); } }

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 50px 60px;
    max-width: 640px;
    width: 90%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    backdrop-filter: blur(6px);
    box-shadow: 0 25px 60px rgba(0,0,0,.5);
  }

  .kanji {
    font-size: 34px;
    color: #ffb3c6;
    letter-spacing: 12px;
    margin-bottom: 22px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  h1 {
    font-size: 54px;
    background: linear-gradient(90deg, #ffd1dc, #ff8fab, #ffd1dc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 18px;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .sub {
    font-size: 20px;
    color: #f4e8fa;
    margin-bottom: 34px;
    opacity: 0.95;
  }

  .divider {
    width: 120px;
    height: 2px;
    margin: 0 auto 34px;
    background: linear-gradient(90deg, transparent, #ff8fab, transparent);
  }

  .wishes {
    font-size: 18px;
    line-height: 1.9;
    color: #e9dcf5;
  }

  .torii {
    font-size: 46px;
    margin-top: 26px;
    animation: bob 2.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-8px);} }

  /* Вспышка фейерверка */
  .spark {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff;
    pointer-events: none;
    opacity: 0;
    z-index: 3;
  }

  @media (max-width: 480px) {
    h1 { font-size: 40px; }
    .card { padding: 36px 24px; }
  }
</style>
</head>
<body>

<div class="moon"></div>

<div class="card">
  <div class="kanji">日本 ♡</div>
  <h1>Вера!</h1>
  <div class="sub">お誕生日おめえとう — С днём рождения!</div>
  <div class="divider"></div>
  <div class="wishes">
    Пусть в жизни будет столько же света и красоты,<br>
    сколько лепестков сакуры весной.<br>
    Как гора Фудзи — стойкости и величия.<br>
    Как море — спокойствия и глубины.<br><br>
    幸せになってください — будьте счастливы! ✿
  </div>
  <div class="torii">⛩️</div>
</div>

<script>
  // Лепестки сакуры
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (4 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 9) + 's';
    p.style.transform = 'scale(' + (0.6 + Math.random() * 0.9) + ')';
    document.body.appendChild(p);
  }

  // Фейерверки
  function firework() {
    const sp = document.createElement('div');
    sp.className = 'spark';
    const colors = ['#ffd1dc', '#ff8fab', '#fff', '#ffb3c6', '#ffd700', '#c084fc'];
    sp.style.background = colors[Math.floor(Math.random() * colors.length)];
    sp.style.left = Math.random() * 100 + 'vw';
    sp.style.top = Math.random() * 60 + 'vh';
    sp.style.boxShadow = '0 0 12px 4px currentColor';
    document.body.appendChild(sp);
    const d = Math.random() * 20 + 20;
    sp.animate([
      { transform: 'scale(0.3)', opacity: 0 },
      { transform: 'scale(1)', opacity: 1 },
      { transform: 'scale(2.2)', opacity: 0 }
    ], { duration: d * 100, iterations: 1 });
    setTimeout(() => sp.remove(), d * 120);
  }
  setInterval(firework, 700);
</script>

</body>
</html>
